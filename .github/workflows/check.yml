name: check-data

# 사람이 직접 연 PR에도 검사가 돌도록 남겨 둔다.
# 변경 요약 댓글은 auto-pr.yml이 브랜치가 올라올 때마다 단다.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 검사
        run: python3 scripts/check_data.py
      - name: 수익 계산 결과
        run: python3 scripts/calc.py
