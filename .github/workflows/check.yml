name: check-data

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 검사
        run: python3 scripts/check_data.py
      - name: 수익 계산 결과
        run: python3 scripts/calc.py

  # 바뀐 내용을 한국어 문장으로 요약해 PR 댓글로 단다
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 변경 요약 만들기
        run: python3 scripts/summarize_pr.py origin/${{ github.base_ref }} > summary.md
      - name: PR에 댓글 달기 (있으면 고쳐 쓰기)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file summary.md --edit-last 2>/dev/null \
            || gh pr comment "$PR" --body-file summary.md
